[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "bench-audit"
version = "0.1.0"
description = "Automated audits of LLM and agent benchmarks: unclear tasks, broken environments, and wrong graders"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.12"
dependencies = [
    "pyyaml>=6.0",
]

[project.optional-dependencies]
# Only for `bench-audit generate`, which records agent runs with the `harbor` command.
harbor = ["harbor>=0.3.0"]

[project.urls]
Homepage = "https://autobenchaudit.com"
Paper = "https://arxiv.org/abs/2605.26079"
Repository = "https://github.com/IsThatYou/auto-bench-audit"

[project.scripts]
bench-audit = "bench_audit.cli:main"

[dependency-groups]
dev = ["pytest>=8.0", "ruff>=0.8"]

[tool.hatch.build.targets.wheel]
packages = ["src/bench_audit"]

# Ship the rubrics inside the package, so an installed copy works without the repo.
[tool.hatch.build.targets.wheel.force-include]
"rubrics" = "bench_audit/rubrics"

# Keep the paper data in benchmarks/ (about 680 MB) out of the source archive.
[tool.hatch.build.targets.sdist]
include = ["/src", "/rubrics", "/tests", "/README.md", "/LICENSE", "/pyproject.toml"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 160
# benchmarks/ holds paper-analysis scripts that are not part of the package.
extend-exclude = ["benchmarks"]
target-version = "py312"

[tool.ruff.lint]
# E/W: style, F: unused names and undefined names, I: import order, UP: old syntax, B: likely bugs
select = ["E", "W", "F", "I", "UP", "B"]
ignore = ["E501"]  # long lines: the prompts are long on purpose
